name: Django CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install -r backend/requirements.txt

      - name: Verify installations
        run: |
          pip list | grep decouple
          python -c "import decouple; print('SUCCESS: decouple imported')"

      - name: Create .env file for CI
        run: |
          cd backend
          echo "SECRET_KEY=django-insecure-test-key-123456789" > .env
          echo "DEBUG=True" >> .env
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env

      - name: Run migrations
        run: |
          cd backend
          python manage.py makemigrations
          python manage.py migrate

      - name: Run tests
        run: |
          cd backend
          python manage.py test